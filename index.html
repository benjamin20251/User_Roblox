
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Roblox User Finder</title>
  <link rel="icon" href="https://images.rbxcdn.com/e854eb7b2951ac03edba9a2681032bba.ico">

  <style>
    :root {
      --bg: #080808;
      --card: #151515;
      --accent: #ff4747;
      --text: #f4f4f4;
      --muted: #aaa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(ellipse at top, #1c1010, var(--bg) 65%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      width: 100%;
      max-width: 820px;
      position: relative;
      padding-top: 58px;
    }

    .lang-switch {
      position: absolute;
      right: 0;
      top: 0;
      z-index: 10;
    }

    .lang-btn {
      padding: 9px 12px;
      color: var(--text);
      background: #171717;
      border: 1px solid #333;
      border-radius: 9px;
      cursor: pointer;
    }

    .lang-list {
      display: none;
      position: absolute;
      right: 0;
      top: 44px;
      min-width: 150px;
      padding: 6px;
      background: #202020;
      border: 1px solid #333;
      border-radius: 10px;
      box-shadow: 0 10px 30px #000a;
    }

    .lang-list button {
      display: block;
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      color: var(--text);
      text-align: left;
      background: transparent;
      cursor: pointer;
    }

    .lang-list button:hover {
      background: #393939;
    }

    .card {
      padding: 28px 20px;
      text-align: center;
      background: #ffffff06;
      border: 1px solid #ff47472b;
      border-radius: 16px;
      box-shadow: 0 15px 40px #0008;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: clamp(23px, 5vw, 30px);
    }

    .subtitle,
    .note {
      color: var(--muted);
    }

    .subtitle {
      margin-bottom: 24px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    input {
      width: min(100%, 260px);
      padding: 12px 14px;
      border: 1px solid #333;
      border-radius: 10px;
      outline: none;
      background: #101010;
      color: var(--text);
      font-size: 16px;
    }

    input:focus {
      border-color: var(--accent);
    }

    button.search {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button.search:hover {
      background: #ff6868;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #result {
      width: 220px;
      max-width: 100%;
      min-height: 30px;
      margin: 24px auto 0;
      padding: 14px;
      overflow-wrap: anywhere;
      background: #ffffff08;
      border: 1px solid #ff47472b;
      border-radius: 12px;
      box-shadow: 0 6px 25px #0005;
    }

    #result:empty {
      display: none;
    }

    .avatar {
      display: block;
      width: 110px;
      height: 110px;
      margin: 12px auto 0;
      border: 2px solid var(--accent);
      border-radius: 50%;
      object-fit: cover;
    }

    .idline {
      margin: 8px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .error {
      color: #ff7777;
    }

    .loading {
      color: var(--accent);
      animation: pulse 1s infinite alternate;
    }

    .note {
      margin: 20px 0 0;
      font-size: 14px;
    }

    @keyframes pulse {
      from { opacity: .45; }
      to { opacity: 1; }
    }

    @media (max-width: 460px) {
      .card {
        padding: 24px 14px;
      }

      .controls {
        flex-direction: column;
      }

      input,
      button.search {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="lang-switch">
      <button
        class="lang-btn"
        id="langBtn"
        type="button"
        aria-expanded="false"
        aria-haspopup="true"
      >
        <span id="langLabel">Change</span> ▾
      </button>

      <div class="lang-list" id="langList">
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="es">Español</button>
        <button type="button" data-lang="pt">Português</button>
      </div>
    </div>

    <section class="card">
      <h1 id="title">Roblox User Finder</h1>

      <p class="subtitle" id="subtitle">
        Type a Roblox username to see their avatar
      </p>

      <form class="controls" id="searchForm">
        <input
          id="usernameInput"
          type="text"
          placeholder="Ex: Builderman"
          maxlength="20"
          autocomplete="off"
          spellcheck="false"
          aria-label="Roblox username"
        >

        <button class="search" id="searchButton" type="submit">
          Search
        </button>
      </form>

      <div id="result" aria-live="polite"></div>

      <p class="note" id="noteText">
        If someone sends you a name and you're not sure they're real, check here.
      </p>
    </section>
  </main>

  <script>
    const I18N = {
      en: {
        langLabel: "Change",
        title: "Roblox User Finder",
        subtitle: "Type a Roblox username to see their avatar",
        placeholder: "Ex: Builderman",
        search: "Search",
        loading: "🔍 Searching...",
        empty: "⚠️ Please enter a username.",
        notFound: "❌ User not found.",
        noAvatar: "❌ Avatar not found.",
        network: "❌ Could not connect to Roblox. Try again later.",
        note: "If someone sends you a name and you're not sure they're real, check here."
      },
      es: {
        langLabel: "Cambiar",
        title: "Buscador de Usuarios Roblox",
        subtitle: "Escribe un nombre de usuario para ver su avatar",
        placeholder: "Ej: Builderman",
        search: "Buscar",
        loading: "🔍 Buscando...",
        empty: "⚠️ Escribe un nombre de usuario.",
        notFound: "❌ Usuario no encontrado.",
        noAvatar: "❌ No se encontró el avatar.",
        network: "❌ No se pudo conectar con Roblox. Inténtalo más tarde.",
        note: "Si alguien te pasa un nombre y no sabes si es real, compruébalo aquí."
      },
      pt: {
        langLabel: "Mudar",
        title: "Buscador de Usuários Roblox",
        subtitle: "Digite um nome de usuário para ver o avatar",
        placeholder: "Ex: Builderman",
        search: "Buscar",
        loading: "🔍 Procurando...",
        empty: "⚠️ Digite um nome de usuário.",
        notFound: "❌ Usuário não encontrado.",
        noAvatar: "❌ Avatar não encontrado.",
        network: "❌ Não foi possível conectar ao Roblox. Tente novamente.",
        note: "Se alguém te passar um nome e você não souber se é real, confira aqui."
      }
    };

    const $ = id => document.getElementById(id);

    const langBtn = $("langBtn");
    const langList = $("langList");
    const result = $("result");
    const input = $("usernameInput");
    const form = $("searchForm");
    const searchButton = $("searchButton");

    let currentLang = "en";
    let lastResult = null;

    function getSavedLang() {
      try {
        const saved = localStorage.getItem("rbx_lang");

        if (saved && I18N[saved]) return saved;
      } catch {}

      const browserLang = navigator.language.toLowerCase();

      if (browserLang.startsWith("es")) return "es";
      if (browserLang.startsWith("pt")) return "pt";

      return "en";
    }

    function applyLang(lang) {
      if (!I18N[lang]) lang = "en";

      currentLang = lang;
      const t = I18N[lang];

      document.documentElement.lang = lang;
      $("langLabel").textContent = t.langLabel;
      $("title").textContent = t.title;
      $("subtitle").textContent = t.subtitle;
      input.placeholder = t.placeholder;
      searchButton.textContent = t.search;
      $("noteText").textContent = t.note;

      try {
        localStorage.setItem("rbx_lang", lang);
      } catch {}

      if (lastResult) {
        if (lastResult.type === "loading") {
          showMessage(t.loading, "loading");
        } else if (lastResult.type === "error") {
          showMessage(t[lastResult.key], "error");
        }
      }
    }

    function showMessage(message, className = "") {
      result.replaceChildren();

      const p = document.createElement("p");
      p.className = className;
      p.textContent = message;

      result.appendChild(p);
    }

    function setResult(type, key) {
      lastResult = { type, key };
      showMessage(I18N[currentLang][key],
        type === "loading" ? "loading" : "error");
    }

    langBtn.addEventListener("click", event => {
      event.stopPropagation();

      const open = langList.style.display !== "block";

      langList.style.display = open ? "block" : "none";
      langBtn.setAttribute("aria-expanded", String(open));
    });

    langList.addEventListener("click", event => {
      const button = event.target.closest("[data-lang]");

      if (!button) return;

      applyLang(button.dataset.lang);
      langList.style.display = "none";
      langBtn.setAttribute("aria-expanded", "false");
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".lang-switch")) {
        langList.style.display = "none";
        langBtn.setAttribute("aria-expanded", "false");
      }
    });

    // CORS proxy: permite intentar consultar la API desde el navegador.
    // El proxy es un servicio externo y puede tener límites o interrupciones.
    async function apiRequest(targetUrl, options = {}) {
      const proxyUrl =
        "https://corsproxy.io/?url=" + encodeURIComponent(targetUrl);

      const response = await fetch(proxyUrl, {
        ...options,
        signal: AbortSignal.timeout(15000)
      });

      if (!response.ok) {
        throw new Error("network");
      }

      return response.json();
    }

    async function getUser(username) {
      const data = await apiRequest(
        "https://users.roblox.com/v1/usernames/users",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            usernames: [username],
            excludeBannedUsers: false
          })
        }
      );

      if (!data.data || data.data.length === 0) {
        throw new Error("notfound");
      }

      return data.data[0];
    }

    async function getAvatar(userId) {
      const url =
        "https://thumbnails.roblox.com/v1/users/avatar-headshot" +
        `?userIds=${encodeURIComponent(userId)}` +
        "&size=150x150&format=Png&isCircular=false";

      const data = await apiRequest(url);

      if (
        !data.data ||
        !data.data.length ||
        !data.data[0].imageUrl
      ) {
        throw new Error("noavatar");
      }

      return data.data[0].imageUrl;
    }

    function showUser(user, avatarUrl) {
      lastResult = null;
      result.replaceChildren();

      const username = document.createElement("p");
      username.style.fontWeight = "700";
      username.textContent = user.name;

      const displayName = document.createElement("p");
      displayName.style.color = "#aaa";
      displayName.textContent = user.displayName;

      const id = document.createElement("p");
      id.className = "idline";
      id.textContent = "ID: " + user.id;

      const avatar = document.createElement("img");
      avatar.className = "avatar";
      avatar.alt = "Avatar of " + user.name;
      avatar.loading = "lazy";
      avatar.referrerPolicy = "no-referrer";
      avatar.src = avatarUrl;

      avatar.addEventListener("error", () => {
        avatar.alt = "Avatar unavailable";
      }, { once: true });

      result.append(username, displayName, id, avatar);
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const username = input.value.trim();

      if (!username) {
        setResult("error", "empty");
        return;
      }

      searchButton.disabled = true;
      setResult("loading", "loading");

      try {
        const user = await getUser(username);
        const avatarUrl = await getAvatar(user.id);

        showUser(user, avatarUrl);
      } catch (error) {
        if (error.message === "notfound") {
          setResult("error", "notFound");
        } else if (error.message === "noavatar") {
          setResult("error", "noAvatar");
        } else {
          console.error("Roblox API error:", error);
          setResult("error", "network");
        }
      } finally {
        searchButton.disabled = false;
      }
    });

    window.addEventListener("storage", event => {
      if (event.key === "rbx_lang") {
        applyLang(
          event.newValue && I18N[event.newValue]
            ? event.newValue
            : getSavedLang()
        );
      }
    });

    applyLang(getSavedLang());
  </script>
</body>
</html>
