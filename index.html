<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Búsqueda de Usuarios Roblox</title>
  <link href="https://images.rbxcdn.com/e854eb7b2951ac03edba9a2681032bba.ico" rel="icon" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg1: #000;
      --bg2: #111;
      --accent: #ff4747;
      --card: #1a1a1a;
      --muted: #aaa;
      --white: #f4f4f4;
    }

    html,body { height: 100%; margin: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg1) 60%, var(--bg2));
      color: var(--white);
      display: flex;
      align-items: start;
      justify-content: center;
      padding: 32px;
    }

    .app {
      width: 100%;
      max-width: 820px;
      position: relative;
    }

    /* Top right language control */
    .lang-switch {
      position: absolute;
      right: 0;
      top: 0;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .lang-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--white);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      transition: all .15s ease;
    }

    .lang-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.6); }

    .lang-list {
      position: absolute;
      right: 0;
      top: 44px;
      background: var(--card);
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      display: none;
      min-width: 160px;
      z-index: 50;
    }

    .lang-list button {
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      background: transparent;
      border: none;
      color: var(--white);
      border-radius: 6px;
      cursor: pointer;
    }

    .lang-list button:hover { background: rgba(255,71,71,0.06); }

    /* Main card */
    .card {
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      text-align: center;
      border: 1px solid rgba(255,71,71,0.06);
    }

    h1 {
      color: var(--accent);
      margin: 0 0 6px 0;
      font-size: 28px;
      text-shadow: 0 0 10px rgba(255,71,71,0.08);
    }

    .subtitle { color: var(--muted); margin: 0 0 18px 0; }

    .controls { display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    input {
      font-size: 1rem;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      background: #0e0e0e;
      color: var(--white);
      width: 220px;
      outline: none;
      transition: box-shadow .15s ease, transform .15s ease;
    }
    input:focus { box-shadow: 0 6px 20px rgba(255,71,71,0.08); transform: translateY(-2px); border-color: var(--accent); }
    button.search {
      font-size: 1rem;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 700;
      transition: transform .12s ease, background .12s ease;
    }
    button.search:hover { transform: translateY(-2px); background: #ff6969; }

    /* Result small card at center */
    #result {
      margin: 20px auto 0;
      padding: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.015));
      border-radius: 12px;
      width: 220px; /* más chico, como pediste */
      color: var(--white);
      box-shadow: 0 6px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,71,71,0.06);
      transition: box-shadow .2s ease, transform .2s ease;
    }
    #result:hover { box-shadow: 0 10px 40px rgba(255,71,71,0.08); transform: translateY(-3px); }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      display:block;
      margin: 8px auto 0;
      border: 2px solid var(--accent);
    }

    .idline { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }

    .loading { animation: pulse 1s infinite alternate; color: var(--accent); }
    @keyframes pulse { 0% { opacity: .4 } 100% { opacity: 1 } }

    /* Small footer note */
    .note { color: var(--muted); font-size: 0.9rem; margin-top: 14px; }

    /* small responsive */
    @media (max-width:460px) {
      .app { padding: 16px; }
      input { width: 160px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- Language switcher (top-right) -->
    <div class="lang-switch" aria-hidden="false">
      <div style="position:relative;">
        <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false">
          <span id="langLabel">Change</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="opacity:0.9">
            <path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="lang-list" id="langList" role="menu" aria-labelledby="langBtn">
          <button data-lang="en">English</button>
          <button data-lang="es">Español</button>
          <button data-lang="pt">Português</button>
        </div>
      </div>
    </div>

    <div class="card" role="main">
      <h1 id="title">Roblox User Finder</h1>
      <p class="subtitle" id="subtitle">Type a Roblox username to see their avatar</p>

      <div class="controls">
        <input id="usernameInput" placeholder="Ex: Builderman" />
        <button class="search" id="searchButton">Search</button>
      </div>

      <div id="result" aria-live="polite"></div>

      <p class="note" id="noteText">If someone sends you a name and you're not sure they're real, check here.</p>
    </div>
  </div>

  <script>
    // --- TRANSLATIONS ---
    const I18N = {
      en: {
        langLabel: 'Change',
        title: 'Roblox User Finder',
        subtitle: 'Type a Roblox username to see their avatar',
        placeholder: 'Ex: Builderman',
        search: 'Search',
        loading: '🔍 Searching...',
        emptyName: '⚠️ Please enter a name.',
        notFound: '❌ User not found',
        noAvatar: '❌ Avatar not found',
        note: "If someone sends you a name and you're not sure they're real, check here."
      },
      es: {
        langLabel: 'Cambiar',
        title: 'Buscador de Usuarios Roblox',
        subtitle: 'Escribe un nombre de usuario para ver su avatar',
        placeholder: 'Ej: Builderman',
        search: 'Buscar',
        loading: '🔍 Buscando...',
        emptyName: '⚠️ Escribe un nombre.',
        notFound: '❌ Usuario no encontrado',
        noAvatar: '❌ No se encontró avatar',
        note: 'Si alguien te manda un nombre y no estás seguro si es real, compruébalo aquí.'
      },
      pt: {
        langLabel: 'Mudar',
        title: 'Buscador de Usuários Roblox',
        subtitle: 'Digite um nome de usuário para ver o avatar',
        placeholder: 'Ex: Builderman',
        search: 'Buscar',
        loading: '🔍 Procurando...',
        emptyName: '⚠️ Digite um nome.',
        notFound: '❌ Usuário não encontrado',
        noAvatar: '❌ Avatar não encontrado',
        note: 'Se alguém te mandar um nome e você não tiver certeza se é real, verifique aqui.'
      }
    };

    // --- Elements ---
    const langBtn = document.getElementById('langBtn');
    const langList = document.getElementById('langList');
    const langLabel = document.getElementById('langLabel');

    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const inputEl = document.getElementById('usernameInput');
    const searchBtn = document.getElementById('searchButton');
    const resultEl = document.getElementById('result');
    const noteEl = document.getElementById('noteText');

    // --- Language setup ---
    function detectDefaultLang() {
      const stored = localStorage.getItem('rbx_lang');
      if (stored) return stored;
      const nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      if (nav.startsWith('es')) return 'es';
      if (nav.startsWith('pt')) return 'pt';
      return 'en';
    }

    let CURRENT_LANG = detectDefaultLang();

    function applyLang(lang) {
      const t = I18N[lang] || I18N.en;
      langLabel.textContent = t.langLabel;
      titleEl.textContent = t.title;
      subtitleEl.textContent = t.subtitle;
      inputEl.placeholder = t.placeholder;
      searchBtn.textContent = t.search;
      noteEl.textContent = t.note;
      localStorage.setItem('rbx_lang', lang);
      CURRENT_LANG = lang;
    }

    // initialize
    applyLang(CURRENT_LANG);

    // Toggle dropdown
    langBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = langList.style.display === 'block';
      langList.style.display = open ? 'none' : 'block';
      langBtn.setAttribute('aria-expanded', !open);
    });

    // choose language
    langList.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-lang]');
      if (!btn) return;
      const lang = btn.dataset.lang;
      applyLang(lang);
      langList.style.display = 'none';
      langBtn.setAttribute('aria-expanded', 'false');
    });

    // close on outside click
    document.addEventListener('click', () => {
      langList.style.display = 'none';
      langBtn.setAttribute('aria-expanded', 'false');
    });

    // --- Roblox API functions (same proxy approach) ---
    async function getUserId(username) {
      const proxy = 'https://corsproxy.io/?';
      const url = proxy + 'https://users.roblox.com/v1/usernames/users';
      const body = { usernames: [username], excludeBannedUsers: true };

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!response.ok) throw new Error('network');
      const data = await response.json();
      if (!data.data || data.data.length === 0) throw new Error('notfound');
      return data.data[0].id;
    }

    async function getAvatarThumbnail(userId) {
      const proxy = 'https://corsproxy.io/?';
      const url = proxy + `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=png&isCircular=false`;
      const response = await fetch(url);
      if (!response.ok) throw new Error('network');
      const data = await response.json();
      if (!data.data || data.data.length === 0) throw new Error('noavatar');
      return data.data[0].imageUrl;
    }

    // --- UI actions ---
    searchBtn.addEventListener('click', async () => {
      const lang = CURRENT_LANG;
      const t = I18N[lang];
      const username = inputEl.value.trim();
      if (!username) {
        resultEl.innerHTML = `<p style="color:tomato">${t.emptyName}</p>`;
        return;
      }

      resultEl.innerHTML = `<p class="loading">${t.loading}</p>`;
      try {
        const userId = await getUserId(username);
        const avatarUrl = await getAvatarThumbnail(userId);
        resultEl.innerHTML = `
          <p style="font-weight:700">${username}</p>
          <p class="idline">ID: ${userId}</p>
          <img class="avatar" src="${avatarUrl}" alt="Avatar of ${username}" />
        `;
      } catch (err) {
        const code = err.message;
        if (code === 'notfound') resultEl.innerHTML = `<p style="color:tomato">${I18N[lang].notFound}</p>`;
        else if (code === 'noavatar') resultEl.innerHTML = `<p style="color:tomato">${I18N[lang].noAvatar}</p>`;
        else resultEl.innerHTML = `<p style="color:tomato">❌ ${err.message}</p>`;
      }
    });

    // also allow Enter key
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchBtn.click();
    });

    // Optional: apply language immediately if user changes browser language while open (rare)
    window.addEventListener('storage', (e) => {
      if (e.key === 'rbx_lang') applyLang(e.newValue || detectDefaultLang());
    });
  </script>
</body>
</html>
